<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Interfaz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="tema-claro">
    <!-- Parte 1: Contenedor vacío para bienvenida dinámica -->
    <div id="contenedor-bienvenida"></div>

    <!-- Parte 2 y 3: Formulario -->
    <form id="formulario">
        <div class="campo-formulario">
            <label for="nombre-usuario">Nombre de Usuario:</label>
            <input type="text" id="nombre-usuario" placeholder="Introduce tu nombre">
        </div>

        <div class="campo-formulario">
            <label for="color-fondo">Color de fondo:</label>
            <input type="color" id="color-fondo" value="#ffffff">
        </div>

        <div class="campo-formulario">
            <label for="tema-visual">Tema Visual:</label>
            <select id="tema-visual">
                <option value="claro">Modo Claro</option>
                <option value="oscuro">Modo Oscuro</option>
            </select>
        </div>

        <!-- Botones de acción -->
        <div class="contenedor-botones">
            <button type="submit" id="btn-guardar">Guardar Preferencias</button>
            <button type="button" id="btn-restablecer">Restablecer Interfaz</button>
        </div>
    </form>
</body>

</html>
